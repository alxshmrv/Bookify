networks:
  bookify:
    driver: bridge
    
services:
  bookify-webapi:
    image: webapi
    build:
      context: ./
      dockerfile: Bookify.WebApi/Dockerfile
    ports:
      - '5001:8080'
    env_file: .env
    environment:
      - ConnectionStrings__Database=Server=bookify-db;Port=5432;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      - Authentication__Audience=${AUDIENCE}
      - Authentication__ValidIssuer=${VALID_ISSUER}
      - Authentication__MetadataUrl=${METADATA_URL}
      - Authentication__RequireHttpsMetadata=${HTTPS}
      - Keycloak__AdminUrl=http://bookify-idp:8080/admin/realms/bookify/
      - Keycloak__TokenUrl=http://bookify-idp:8080/realms/bookify/protocol/openid-connect/token
      - Keycloak__AdminClientId=bookify-admin-client
      - Keycloak__AdminClientSecret=UZDmbNxWmV4TlpaCRcju6pMRsyuV3er1
      - Keycloak__AuthClientId=bookify-auth-client
      - Keycloak__AuthClientSecret=3E3yvXaYppoYBF3Ir6DgtEzADKKzSurZ
    networks:
      - bookify
    depends_on:
      bookify-db:
        condition: service_healthy
      bookify-redis:
        condition: service_healthy

  bookify-db:
    image: postgres:latest
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    ports:
      - '5435:5432'
    networks:
      - bookify
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      
  bookify-idp:
    image: keycloak/keycloak:latest
    command: start-dev --import-realm
    env_file: .env
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_PASSWORD}
    volumes:
      - ./.containers/identity:/opt/keycloak/data/
      - ./.files/${REALM_EXPORT_FILE}:/opt/keycloak/data/import/realm.json
    ports:
      - '18080:8080'
    networks:
      - bookify    
        
  bookify-seq:
    image: datalust/seq:latest
    env_file: .env
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_FIRSTRUN_ADMINPASSWORD}
    ports:
      - '5341:5341'
      - '8081:80'
    networks:
      - bookify
  
  bookify-redis:
    image: redis:7.2
    restart: always
    ports:
      - '6379:6379'
    networks:
      - bookify
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5